# Fallback project definition.
#
# BudgetBestie.xcodeproj is committed and should open directly in Xcode 16+.
# If it ever fails to open — a hand-edited pbxproj is fragile — regenerate it
# on the Mac with:
#
#     brew install xcodegen && xcodegen generate
#
# The two definitions are kept in sync by hand; this one is the simpler of the
# pair, so treat it as the spec if they ever disagree.

name: BudgetBestie
options:
  bundleIdPrefix: com.budgetbestie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BudgetKit:
    path: Packages/BudgetKit

targets:
  BudgetBestie:
    type: application
    platform: iOS
    sources:
      - path: BudgetBestie
    dependencies:
      - package: BudgetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetbestie.clone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Budget Bestie uses Face ID to keep your budget private."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
